<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RDV" />
    <title>RDV Lançamentos</title>
    <script>
      // Abrindo com ?app=ruptura o navegador oferece instalar o app "Ruptura"
      // (ícone, nome e cor próprios, abre direto na checagem).
      if (new URLSearchParams(location.search).get('app') === 'ruptura') {
        document.querySelector('link[rel="manifest"]').href = '/manifest-ruptura.json';
        document.querySelector('link[rel="apple-touch-icon"]').href = '/ruptura-192.png';
        document.querySelector('meta[name="theme-color"]').content = '#14532d';
        document.querySelector('meta[name="apple-mobile-web-app-title"]').content = 'Ruptura';
        document.title = 'Ruptura';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
